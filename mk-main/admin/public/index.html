<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>MK Admin</title><meta name="theme-color" content="#f7f5f2"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="/admin.css"></head><body>
<main id="lg" class="card"><h1>MK Admin</h1><p>Owner access only.</p>
<form id="lf"><div class="pwr"><input id="pw" type="password" placeholder="Admin password" autocomplete="current-password" aria-label="Admin password" required><button type="button" id="sp" class="eye" aria-pressed="false">Show</button></div><p id="cl" class="hint" hidden>Caps Lock is on</p><button class="btn" id="lb">Log in</button><p id="er" role="alert"></p></form></main>
<main id="db" hidden><header><h1>MK Admin</h1><div><button id="rf" class="btn ghost">Refresh</button><button id="ex" class="btn ghost">Export CSV</button><button id="lo" class="btn">Log out</button></div></header>
<section id="st" class="stats"></section><div class="flt"><input id="q" type="search" placeholder="Search by order ID, name, email or product" aria-label="Search orders"><select id="sf" aria-label="Filter by status"><option value="">All statuses</option></select></div><div id="tb"></div></main>
<script src="/admin.js"></script></body></html>
